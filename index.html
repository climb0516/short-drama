<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>DramaPulse · 短剧速递</title>
  <meta name="description" content="热门短剧推荐（AI / 真人）、短剧行业新闻、AI 对短剧行业的影响">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a090d;
      --panel: rgba(24,21,30,0.72);
      --panel-solid: #15131a;
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --text-1: #efedf2;
      --text-2: #a7a1b0;
      --text-3: #6c6676;
      --accent: #ff4d8d;
      --accent-2: #a855f7;
      --grad: linear-gradient(120deg, #ff4d6d 0%, #ff4d8d 40%, #a855f7 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(255,77,141,0.15);
      --glow-2: rgba(168,85,247,0.10);
      --ai: #a78bfa;
      --live: #fbbf24;
      --pos: #34d399;
      --neg: #f87171;
      --neu: #94a3b8;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #faf8fb;
      --panel: rgba(255,255,255,0.86);
      --panel-solid: #ffffff;
      --hover: rgba(30,10,40,0.035);
      --line: rgba(30,10,40,0.08);
      --line-2: rgba(30,10,40,0.15);
      --text-1: #1b1420;
      --text-2: #5d5466;
      --text-3: #958c9e;
      --accent: #db2777;
      --accent-2: #7c3aed;
      --grid-dot: rgba(30,10,40,0.06);
      --glow-1: rgba(219,39,119,0.08);
      --glow-2: rgba(124,58,237,0.06);
      --ai: #7c3aed;
      --live: #b45309;
      --pos: #059669;
      --neg: #dc2626;
      --neu: #64748b;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(60,20,60,0.07);
      --kbd-bg: rgba(30,10,40,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 420px at 15% -10%, var(--glow-1), transparent 70%),
        radial-gradient(800px 400px at 90% -5%, var(--glow-2), transparent 70%),
        radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* ── 顶栏 ── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1240px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; gap: 18px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
    .tabs { display: flex; gap: 4px; background: var(--hover); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
    .tab { padding: 6px 14px; border-radius: 8px; color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--panel-solid); color: var(--text-1); box-shadow: 0 0 0 1px var(--line-2); }
    .tab .cnt { font-weight: 500; color: var(--text-3); margin-left: 4px; font-size: 12px; }
    .spacer { flex: 1; }
    .search {
      display: flex; align-items: center; gap: 8px; width: 240px;
      background: var(--hover); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px;
    }
    .search:focus-within { border-color: var(--line-2); }
    .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text-1); font: inherit; }
    .search input::placeholder { color: var(--text-3); }
    kbd { font-family: inherit; font-size: 11px; color: var(--text-3); background: var(--kbd-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }

    /* ── 布局 ── */
    .layout { max-width: 1240px; margin: 0 auto; padding: 22px 20px 60px; display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 22px; }
    .aside { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
    .widget { padding: 16px; }
    .widget h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    .hero { margin-bottom: 18px; }
    .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--text-2); margin-top: 6px; max-width: 760px; }
    .meta-line { color: var(--text-3); font-size: 12px; margin-top: 8px; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip {
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2);
      font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .chip:hover { border-color: var(--line-2); color: var(--text-1); }
    .chip.active { background: var(--text-1); color: var(--bg); border-color: var(--text-1); }
    .chip .n { opacity: .6; font-size: 11.5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .section-title { font-size: 15px; font-weight: 700; margin: 30px 0 12px; display: flex; align-items: baseline; gap: 8px; }
    .section-title small { color: var(--text-3); font-weight: 500; font-size: 12px; }

    /* ── 推荐卡片 ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .2s; position: relative; }
    .card:hover { box-shadow: 0 0 0 1px var(--line-2), 0 14px 34px rgba(0,0,0,0.3); }
    .card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    .badge.ai { color: var(--ai); background: color-mix(in srgb, var(--ai) 14%, transparent); }
    .badge.live { color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }
    .badge.plain { color: var(--text-3); background: var(--hover); font-weight: 500; }
    .card h4 { font-size: 15.5px; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
    .rank-note { font-size: 12px; color: var(--accent); font-weight: 600; }
    .heat { font-size: 12px; color: var(--text-3); }
    .card p { color: var(--text-2); font-size: 13px; }
    .why { font-size: 12.5px; color: var(--text-2); border-left: 2px solid var(--accent); padding-left: 9px; }
    .tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { font-size: 11px; color: var(--text-3); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
    .src { font-size: 11.5px; color: var(--text-3); margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .src a:hover { color: var(--text-1); text-decoration: underline; }
    /* 封面横幅：竖版海报裁成横条，保留偏上的人物区域 */
    .card.has-cover { padding-top: 0; overflow: hidden; }
    .banner { position: relative; height: 140px; margin: 0 -16px; background: var(--hover); }
    .banner img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
    .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 35%, var(--panel-solid) 100%); }
    .banner .card-top { position: absolute; left: 16px; bottom: 10px; z-index: 1; }
    .banner .badge.plain { background: rgba(0,0,0,.45); color: #f1eef4; backdrop-filter: blur(6px); }
    .banner .badge.ai, .banner .badge.live { backdrop-filter: blur(6px); background: color-mix(in srgb, var(--panel-solid) 55%, transparent); }
    .banner-rank { position: absolute; top: 10px; right: 12px; z-index: 1; font-size: 12px; font-weight: 800; color: #fff; padding: 2px 9px; border-radius: 999px; background: var(--grad); box-shadow: 0 2px 10px rgba(0,0,0,.3); }
    .summary-box { padding: 14px 16px; margin-bottom: 16px; font-size: 13.5px; color: var(--text-2); display: flex; gap: 10px; }
    .summary-box b { color: var(--text-1); }

    /* 海外热播 */
    .reel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .reel { display: flex; flex-direction: column; gap: 6px; }
    .reel-cover { aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--hover); position: relative; box-shadow: 0 0 0 1px var(--line); }
    .reel-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
    .reel:hover img { transform: scale(1.04); }
    .reel-rank { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; }
    .reel-views { position: absolute; bottom: 6px; right: 6px; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; }
    .reel h5 { font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .reel .tags { margin-top: -2px; }

    /* ── 新闻列表 ── */
    .news { display: flex; flex-direction: column; }
    .news-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .news-item:last-child { border-bottom: 0; }
    .news-item:hover { background: var(--hover); }
    .news-item.s-positive { box-shadow: inset 3px 0 0 var(--pos); }
    .news-item.s-negative { box-shadow: inset 3px 0 0 var(--neg); }
    .news-item.s-neutral  { box-shadow: inset 3px 0 0 var(--neu); }
    .news-body { flex: 1; min-width: 0; }
    .news-title { font-size: 14.5px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
    .news-title:hover { color: var(--accent); }
    .news-meta { margin-top: 5px; font-size: 12px; color: var(--text-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .news-meta .source { color: var(--text-2); font-weight: 500; }
    .senti { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
    .senti.positive { color: var(--pos); background: color-mix(in srgb, var(--pos) 14%, transparent); }
    .senti.negative { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, transparent); }
    .senti.neutral  { color: var(--neu); background: color-mix(in srgb, var(--neu) 14%, transparent); }
    .signal { font-size: 11px; color: var(--text-3); }
    .day-sep { padding: 10px 16px 6px; font-size: 12px; font-weight: 700; color: var(--text-3); background: var(--hover); border-bottom: 1px solid var(--line); }
    .more { display: block; width: 100%; padding: 12px; color: var(--text-2); font-weight: 600; border-top: 1px solid var(--line); }
    .more:hover { color: var(--text-1); background: var(--hover); }
    .empty { padding: 40px 16px; text-align: center; color: var(--text-3); }

    /* ── 舆论温度计 ── */
    .meter { padding: 16px; margin-bottom: 16px; }
    .meter-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
    .meter-head b { font-size: 14px; }
    .meter-head span { font-size: 12px; color: var(--text-3); }
    .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--hover); gap: 2px; }
    .bar > i { display: block; height: 100%; }
    .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend b { color: var(--text-1); }
    .verdict { margin-top: 10px; font-size: 12.5px; color: var(--text-2); }

    /* 侧栏 */
    .mini-list { display: flex; flex-direction: column; gap: 10px; }
    .mini-item { display: flex; gap: 10px; font-size: 13px; line-height: 1.45; }
    .mini-item:hover .mini-title { color: var(--accent); }
    .mini-rank { width: 18px; flex-shrink: 0; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .mini-item:nth-child(1) .mini-rank { color: var(--accent); }
    .mini-item:nth-child(2) .mini-rank { color: color-mix(in srgb, var(--accent) 70%, var(--accent-2)); }
    .mini-item:nth-child(3) .mini-rank { color: var(--accent-2); }
    .mini-sub { font-size: 11.5px; color: var(--text-3); }
    .status-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); padding: 3px 0; gap: 8px; }
    .status-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-row .ok { color: var(--pos); } .status-row .bad { color: var(--neg); }
    .foot { font-size: 11.5px; color: var(--text-3); line-height: 1.6; }

    /* ── 响应式 ── */
    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .aside { position: static; }
      .search { width: 180px; }
    }
    @media (max-width: 680px) {
      .topbar-inner { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
      .logo small { display: none; }
      .tabs { order: 3; width: 100%; overflow-x: auto; }
      .tab { flex: 1; text-align: center; padding: 6px 8px; }
      .search { flex: 1; width: auto; }
      .search kbd { display: none; }
      .layout { padding: 16px 16px 50px; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -16px; margin-right: -16px; padding: 0 16px; }
      .chips::-webkit-scrollbar { display: none; }
      .hero h1 { font-size: 20px; }
      .reel-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🎬</div>DramaPulse<small>短剧速递</small></div>
      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="picks">热门推荐</button>
        <button class="tab" data-tab="industry">行业新闻<span class="cnt" id="cnt-industry"></span></button>
        <button class="tab" data-tab="ai">AI 影响<span class="cnt" id="cnt-ai"></span></button>
      </nav>
      <div class="spacer"></div>
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--text-3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索剧名、新闻、来源" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <button class="icon-btn" id="theme" title="切换主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside class="aside" id="aside"></aside>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('dp:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dp:' + k, JSON.stringify(v)); } catch {} },
};

const TOPICS = { all: '全部', policy: '政策监管', overseas: '出海', data: '数据报告', capital: '资本', platform: '平台', general: '其他' };
const SENTI = { positive: '正面', negative: '负面', neutral: '中性' };
const PAGE = 40;

const state = {
  tab: store.get('tab', 'picks'),
  kind: store.get('kind', 'all'),
  topic: 'all',
  senti: 'all',
  q: '',
  limit: PAGE,
};
let DATA = { industry: [], ai: [], overseas: [], status: [] };
let PICKS = { items: [] };

// ── 工具 ──
function ago(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  if (s < 86400 * 7) return Math.round(s / 86400) + ' 天前';
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function dayKey(iso) {
  const d = new Date(iso), now = new Date();
  const diff = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${'日一二三四五六'[d.getDay()]}`;
}
function fmtNum(n) {
  if (!n) return '';
  if (n >= 1e8) return (n / 1e8).toFixed(1) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1) + ' 万';
  return String(n);
}
function match(text) { return !state.q || text.toLowerCase().includes(state.q); }

// ── 渲染：热门推荐 ──
function renderPicks() {
  const items = PICKS.items || [];
  const counts = { all: items.length, ai: items.filter(i => i.kind === 'ai').length, live: items.filter(i => i.kind === 'live').length };
  const list = items.filter(i => (state.kind === 'all' || i.kind === state.kind) &&
    match([i.title, i.form, i.platform, (i.genre || []).join(' '), i.synopsis].join(' ')));
  const reels = (DATA.overseas || []).filter(r => r.shelf === 'top' && match(r.title + ' ' + (r.tags || []).join(' ')));
  const fresh = (DATA.overseas || []).filter(r => r.shelf === 'new' && match(r.title + ' ' + (r.tags || []).join(' ')));

  return `
    <section class="hero">
      <h1>本周值得追的<em>热门短剧</em></h1>
      <p>国内榜单按周整理（AI 漫剧 / AI 仿真人 / 真人），海外热播每 3 小时自动同步 ReelShort。</p>
      <div class="meta-line">推荐更新于 ${esc(PICKS.updated_at || '—')} · ${esc(PICKS.period || '')}</div>
    </section>
    ${PICKS.summary ? `<div class="panel summary-box"><span>📊</span><div><b>本周风向：</b>${esc(PICKS.summary)}</div></div>` : ''}
    <div class="chips">
      ${[['all', '全部'], ['ai', 'AI 剧'], ['live', '真人剧']].map(([k, l]) =>
        `<button class="chip ${state.kind === k ? 'active' : ''}" data-kind="${k}">${k !== 'all' ? `<span class="dot" style="background:var(--${k})"></span>` : ''}${l}<span class="n">${counts[k]}</span></button>`).join('')}
    </div>
    ${list.length ? `<div class="grid">${list.map(pickCard).join('')}</div>` : '<div class="panel empty">没有匹配的剧</div>'}
    ${PICKS.notes ? `<p class="foot" style="margin-top:12px">※ ${esc(PICKS.notes)}</p>` : ''}

    <h2 class="section-title">🌏 海外热播 · ReelShort TOP<small>自动抓取 · 点击直达第 1 集</small></h2>
    ${reels.length ? `<div class="reel-grid">${reels.map((r, i) => reelCard(r, i + 1)).join('')}</div>` : '<div class="panel empty">暂无数据</div>'}
    ${fresh.length ? `<h2 class="section-title">🆕 ReelShort 新上线</h2><div class="reel-grid">${fresh.map(r => reelCard(r)).join('')}</div>` : ''}
  `;
}
function pickCard(i) {
  const top = `<div class="card-top">
      <span class="badge ${i.kind}">${esc(i.form)}</span>
      <span class="badge plain">${esc(i.platform)}</span>
    </div>`;
  const rank = (i.rank_note || '').match(/#(\d+)/);
  // 封面加载失败时去掉横幅，标签回到正文顶部
  const head = i.cover ? `<div class="banner">
      <img src="${esc(i.cover)}" alt="" loading="lazy" onerror="const c=this.closest('.card');c.classList.remove('has-cover');this.parentNode.replaceWith(c.querySelector('.banner .card-top'))">
      ${rank ? `<span class="banner-rank">#${rank[1]}</span>` : ''}
      ${top}
    </div>` : top;
  return `<article class="panel card${i.cover ? ' has-cover' : ''}">
    ${head}
    <h4>${esc(i.title)}</h4>
    <div><div class="rank-note">${esc(i.rank_note)}</div><div class="heat">${esc(i.heat)}</div></div>
    ${i.synopsis ? `<p>${esc(i.synopsis)}</p>` : ''}
    ${i.why_hot ? `<div class="why">${esc(i.why_hot)}</div>` : ''}
    <div class="tags">${(i.genre || []).map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>
    <div class="src">${(i.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">↗ ${esc(s.name)}</a>`).join('')}</div>
  </article>`;
}
function reelCard(r, rank) {
  return `<a class="reel" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.synopsis)}">
    <div class="reel-cover">
      <img src="${esc(r.cover)}" alt="" loading="lazy" onerror="this.style.display='none'">
      ${rank ? `<span class="reel-rank">TOP ${rank}</span>` : ''}
      ${r.views ? `<span class="reel-views">▶ ${fmtNum(r.views)}</span>` : ''}
    </div>
    <h5>${esc(r.title)}</h5>
    <div class="tags">${r.episodes ? `<span class="tag">${r.episodes} 集</span>` : ''}${(r.tags || []).slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
  </a>`;
}

// ── 渲染：新闻列表 ──
function newsList(items) {
  if (!items.length) return '<div class="panel empty">没有匹配的新闻</div>';
  let html = '', lastDay = '';
  items.slice(0, state.limit).forEach(n => {
    const day = dayKey(n.time);
    if (day !== lastDay) { html += `<div class="day-sep">${day}</div>`; lastDay = day; }
    const sentiCls = state.tab === 'ai' ? ` s-${n.sentiment}` : '';
    html += `<div class="news-item${sentiCls}"><div class="news-body">
      <a class="news-title" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="news-meta">
        ${state.tab === 'ai' ? `<span class="senti ${n.sentiment}">${SENTI[n.sentiment]}</span>` : ''}
        ${state.tab === 'industry' && n.topic !== 'general' ? `<span class="badge plain">${TOPICS[n.topic]}</span>` : ''}
        ${state.tab === 'industry' && n.ai_related ? '<span class="badge ai">AI</span>' : ''}
        <span class="source">${esc(n.source)}</span>
        <span>${ago(n.time)}</span>
        ${n.lang === 'en' ? '<span class="badge plain">EN</span>' : ''}
        ${n.also?.length ? `<span>另有 ${n.also.length} 家报道</span>` : ''}
        ${state.tab === 'ai' && n.signals?.length ? `<span class="signal">#${n.signals.map(esc).join(' #')}</span>` : ''}
      </div>
    </div></div>`;
  });
  if (items.length > state.limit) html += `<button class="more" id="more">加载更多（剩余 ${items.length - state.limit} 条）</button>`;
  return `<div class="panel news">${html}</div>`;
}

function renderIndustry() {
  const base = DATA.industry.filter(n => match(n.title + ' ' + n.source));
  const counts = { all: base.length };
  base.forEach(n => counts[n.topic] = (counts[n.topic] || 0) + 1);
  const list = base.filter(n => state.topic === 'all' || n.topic === state.topic);
  return `
    <section class="hero">
      <h1>短剧<em>行业新闻</em></h1>
      <p>政策监管、平台动态、出海、数据报告和资本动向，聚合中外媒体，同一事件多家报道会合并。</p>
      <div class="meta-line">更新于 ${ago(DATA.updated_at)} · 保留近 45 天</div>
    </section>
    <div class="chips">
      ${Object.entries(TOPICS).filter(([k]) => k === 'all' || counts[k]).map(([k, l]) =>
        `<button class="chip ${state.topic === k ? 'active' : ''}" data-topic="${k}">${l}<span class="n">${counts[k] || 0}</span></button>`).join('')}
    </div>
    ${newsList(list)}
  `;
}

function sentiStats(items) {
  const c = { positive: 0, negative: 0, neutral: 0 };
  items.forEach(n => c[n.sentiment]++);
  return c;
}
function meter(items, title, sub) {
  const c = sentiStats(items), total = items.length || 1;
  const pct = k => Math.round(c[k] / total * 100);
  let verdict;
  if (c.negative > c.positive * 1.3) verdict = '负面声音更多：岗位冲击、亏损和版权争议是主要话题。';
  else if (c.positive > c.negative * 1.3) verdict = '正面声音更多：降本提效和产能、出海机会是主要话题。';
  else verdict = '正负面声音大致持平，行业还在争论中。';
  return `<div class="panel meter">
    <div class="meter-head"><b>${title}</b><span>${sub}</span></div>
    <div class="bar">${['positive', 'neutral', 'negative'].map(k => c[k] ? `<i style="width:${c[k] / total * 100}%;background:var(--${k.slice(0, 3)})"></i>` : '').join('')}</div>
    <div class="legend">${['positive', 'negative', 'neutral'].map(k =>
      `<span><span class="dot" style="background:var(--${k.slice(0, 3)})"></span>${SENTI[k]} <b>${c[k]}</b> · ${pct(k)}%</span>`).join('')}</div>
    <div class="verdict">${items.length ? verdict : ''}</div>
  </div>`;
}

function renderAI() {
  const base = DATA.ai.filter(n => match(n.title + ' ' + n.source));
  const c = sentiStats(base);
  const list = base.filter(n => state.senti === 'all' || n.sentiment === state.senti);
  const week = base.filter(n => Date.now() - new Date(n.time) < 7 * 86400000);
  return `
    <section class="hero">
      <h1>AI 对<em>短剧行业</em>的影响</h1>
      <p>只收录讨论 AI 如何改变这个行业的报道：降本提效、产能和出海机会，以及岗位冲击、版权侵权、同质化和亏损等问题，正面负面都收。</p>
      <div class="meta-line">更新于 ${ago(DATA.updated_at)} · 正负面由关键词自动判断，仅供参考</div>
    </section>
    ${meter(week, '近 7 天舆论温度', `${week.length} 篇报道`)}
    <div class="chips">
      <button class="chip ${state.senti === 'all' ? 'active' : ''}" data-senti="all">全部<span class="n">${base.length}</span></button>
      ${['positive', 'negative', 'neutral'].map(k =>
        `<button class="chip ${state.senti === k ? 'active' : ''}" data-senti="${k}"><span class="dot" style="background:var(--${k.slice(0, 3)})"></span>${SENTI[k]}<span class="n">${c[k]}</span></button>`).join('')}
    </div>
    ${newsList(list)}
  `;
}

// ── 侧栏 ──
function renderAside() {
  const ai = DATA.ai, all = sentiStats(ai);
  const topAI = (PICKS.items || []).slice(0, 5);
  const latestAI = ai.slice(0, 5);
  const statusOk = DATA.status.filter(s => s.ok).length;
  return `
    <div class="panel widget">
      <h3>🔥 本周热榜</h3>
      <div class="mini-list">${topAI.map((p, i) => `<div class="mini-item"><span class="mini-rank">${i + 1}</span><div>
        <div class="mini-title">${esc(p.title)}</div><div class="mini-sub">${esc(p.form)} · ${esc(p.rank_note)}</div></div></div>`).join('')}</div>
    </div>
    <div class="panel widget">
      <h3>🤖 AI 影响 · 全部 ${ai.length} 篇</h3>
      <div class="bar">${['positive', 'neutral', 'negative'].map(k => all[k] ? `<i style="width:${all[k] / (ai.length || 1) * 100}%;background:var(--${k.slice(0, 3)})"></i>` : '').join('')}</div>
      <div class="legend" style="gap:10px;font-size:12px">${['positive', 'negative', 'neutral'].map(k => `<span><span class="dot" style="background:var(--${k.slice(0, 3)})"></span>${SENTI[k]} ${all[k]}</span>`).join('')}</div>
      <div class="mini-list" style="margin-top:14px">${latestAI.map(n => `<a class="mini-item" href="${esc(n.url)}" target="_blank" rel="noopener">
        <span class="dot" style="background:var(--${n.sentiment.slice(0, 3)});margin-top:7px"></span>
        <div><div class="mini-title">${esc(n.title)}</div><div class="mini-sub">${esc(n.source)} · ${ago(n.time)}</div></div></a>`).join('')}</div>
    </div>
    <div class="panel widget">
      <h3>📡 数据来源 · ${statusOk}/${DATA.status.length} 正常</h3>
      ${DATA.status.filter(s => !s.ok).map(s => `<div class="status-row"><span>${esc(s.name)}</span><span class="bad">失败</span></div>`).join('')}
      <div class="foot">新闻：Google News 中英文 ${DATA.status.length - 1} 组关键词，每 3 小时抓取<br>海外热播：ReelShort 首页<br>国内推荐：每周人工 + AI 检索整理<br>最近抓取：${DATA.updated_at ? new Date(DATA.updated_at).toLocaleString('zh-CN', { hour12: false }) : '—'}</div>
    </div>
  `;
}

// ── 主渲染 ──
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
  $('#cnt-industry').textContent = DATA.industry.length || '';
  $('#cnt-ai').textContent = DATA.ai.length || '';
  $('#main').innerHTML = { picks: renderPicks, industry: renderIndustry, ai: renderAI }[state.tab]();
  $('#aside').innerHTML = renderAside();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-kind],[data-topic],[data-senti],#more');
  if (!t) return;
  if (t.id === 'more') { state.limit += PAGE; render(); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.limit = PAGE; store.set('tab', state.tab); window.scrollTo({ top: 0 }); }
  if (t.dataset.kind) { state.kind = t.dataset.kind; store.set('kind', state.kind); }
  if (t.dataset.topic) { state.topic = t.dataset.topic; state.limit = PAGE; }
  if (t.dataset.senti) { state.senti = t.dataset.senti; state.limit = PAGE; }
  render();
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); state.limit = PAGE; render(); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; render(); $('#q').blur(); }
});

// 主题
function applyTheme(t) { document.documentElement.dataset.theme = t; }
applyTheme(store.get('theme', 'dark'));
$('#theme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
});

async function load() {
  const bust = '?t=' + Math.floor(Date.now() / 600000);
  const [d, p] = await Promise.all([
    fetch('data.json' + bust).then(r => r.json()).catch(() => null),
    fetch('picks.json' + bust).then(r => r.json()).catch(() => null),
  ]);
  if (d) DATA = d;
  if (p) PICKS = p;
  if (!['picks', 'industry', 'ai'].includes(state.tab)) state.tab = 'picks';
  render();
}
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
