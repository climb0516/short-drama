<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>DramaPulse · 短剧速递</title>
  <meta name="description" content="热门短剧推荐（AI / 真人）、短剧行业新闻、AI 对短剧行业的影响">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a090d;
      --panel: rgba(24,21,30,0.72);
      --panel-solid: #15131a;
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --text-1: #efedf2;
      --text-2: #a7a1b0;
      --text-3: #6c6676;
      --accent: #ff4d8d;
      --accent-2: #a855f7;
      --grad: linear-gradient(120deg, #ff4d6d 0%, #ff4d8d 40%, #a855f7 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(255,77,141,0.15);
      --glow-2: rgba(168,85,247,0.10);
      --ai: #a78bfa;
      --live: #fbbf24;
      --pos: #34d399;
      --neg: #f87171;
      --neu: #94a3b8;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #faf8fb;
      --panel: rgba(255,255,255,0.86);
      --panel-solid: #ffffff;
      --hover: rgba(30,10,40,0.035);
      --line: rgba(30,10,40,0.08);
      --line-2: rgba(30,10,40,0.15);
      --text-1: #1b1420;
      --text-2: #5d5466;
      --text-3: #958c9e;
      --accent: #db2777;
      --accent-2: #7c3aed;
      --grid-dot: rgba(30,10,40,0.06);
      --glow-1: rgba(219,39,119,0.08);
      --glow-2: rgba(124,58,237,0.06);
      --ai: #7c3aed;
      --live: #b45309;
      --pos: #059669;
      --neg: #dc2626;
      --neu: #64748b;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(60,20,60,0.07);
      --kbd-bg: rgba(30,10,40,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 420px at 15% -10%, var(--glow-1), transparent 70%),
        radial-gradient(800px 400px at 90% -5%, var(--glow-2), transparent 70%),
        radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* ── 顶栏 ── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1240px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; gap: 18px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
    .tabs { display: flex; gap: 4px; background: var(--hover); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
    .tab { padding: 6px 14px; border-radius: 8px; color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--panel-solid); color: var(--text-1); box-shadow: 0 0 0 1px var(--line-2); }
    .tab .cnt { font-weight: 500; color: var(--text-3); margin-left: 4px; font-size: 12px; }
    .spacer { flex: 1; }
    .search {
      display: flex; align-items: center; gap: 8px; flex: 0 1 260px; min-width: 140px;   /* 自适应：宽屏 260，窄了跟着收 */
      background: var(--hover); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px;
    }
    .search:focus-within { border-color: var(--line-2); }
    .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text-1); font: inherit; }
    .search input::placeholder { color: var(--text-3); }
    kbd { font-family: inherit; font-size: 11px; color: var(--text-3); background: var(--kbd-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }

    /* ── 布局 ── */
    .layout { max-width: 1240px; margin: 0 auto; padding: 22px 20px 60px; display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 22px; }
    .aside { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
    .widget { padding: 16px; }
    .widget h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    .hero { margin-bottom: 18px; }
    .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--text-2); margin-top: 6px; max-width: 760px; }
    .meta-line { color: var(--text-3); font-size: 12px; margin-top: 8px; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip {
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2);
      font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .chip:hover { border-color: var(--line-2); color: var(--text-1); }
    .chip.active { background: var(--text-1); color: var(--bg); border-color: var(--text-1); }
    .chip .n { opacity: .6; font-size: 11.5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .section-title { font-size: 15px; font-weight: 700; margin: 30px 0 12px; display: flex; align-items: baseline; gap: 8px; }
    .section-title small { color: var(--text-3); font-weight: 500; font-size: 12px; }

    /* ── 推荐卡片 ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .2s; position: relative; }
    .card:hover { box-shadow: 0 0 0 1px var(--line-2), 0 14px 34px rgba(0,0,0,0.3); }
    .card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    .badge.ai { color: var(--ai); background: color-mix(in srgb, var(--ai) 14%, transparent); }
    .badge.live { color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }
    .badge.plain { color: var(--text-3); background: var(--hover); font-weight: 500; }
    .card h4 { font-size: 15.5px; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
    .rank-note { font-size: 12px; color: var(--accent); font-weight: 600; }
    .heat { font-size: 12px; color: var(--text-3); }
    .card p { color: var(--text-2); font-size: 13px; }
    .why { font-size: 12.5px; color: var(--text-2); border-left: 2px solid var(--accent); padding-left: 9px; }
    .tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { font-size: 11px; color: var(--text-3); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
    .src { font-size: 11.5px; color: var(--text-3); margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .src a:hover { color: var(--text-1); text-decoration: underline; }
    /* 封面横幅：竖版海报裁成横条，保留偏上的人物区域 */
    .card.has-cover { padding-top: 0; overflow: hidden; }
    .banner { position: relative; height: 140px; margin: 0 -16px; background: var(--ph, var(--hover)); }
    .banner img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
    .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 35%, var(--panel-solid) 100%); }
    .banner .card-top { position: absolute; left: 16px; bottom: 10px; z-index: 1; }
    .banner .badge.plain { background: rgba(0,0,0,.45); color: #f1eef4; backdrop-filter: blur(6px); }
    .banner .badge.ai, .banner .badge.live { backdrop-filter: blur(6px); background: color-mix(in srgb, var(--panel-solid) 55%, transparent); }
    .banner-rank { position: absolute; top: 10px; right: 12px; z-index: 1; font-size: 12px; font-weight: 800; color: #fff; padding: 2px 9px; border-radius: 999px; background: var(--grad); box-shadow: 0 2px 10px rgba(0,0,0,.3); }
    .summary-box { padding: 14px 16px; margin-bottom: 16px; font-size: 13.5px; color: var(--text-2); display: flex; gap: 10px; }
    .summary-box b { color: var(--text-1); }

    /* 海外热播 */
    .reel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .reel { display: flex; flex-direction: column; gap: 6px; }
    .reel-cover { aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--ph, var(--hover)); position: relative; box-shadow: 0 0 0 1px var(--line); }
    .reel-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
    .reel:hover img { transform: scale(1.04); }
    .reel-rank { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; }
    .reel-views { position: absolute; bottom: 6px; right: 6px; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; }
    .reel h5 { font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .reel .tags { margin-top: -2px; }

    /* ── 新闻列表 ── */
    .news { display: flex; flex-direction: column; }
    .news-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .news-item:last-child { border-bottom: 0; }
    .news-item:hover { background: var(--hover); }
    .news-item.s-positive { box-shadow: inset 3px 0 0 var(--pos); }
    .news-item.s-negative { box-shadow: inset 3px 0 0 var(--neg); }
    .news-item.s-neutral  { box-shadow: inset 3px 0 0 var(--neu); }
    .news-body { flex: 1; min-width: 0; }
    .news-title { font-size: 14.5px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
    .news-title:hover { color: var(--accent); }
    .news-meta { margin-top: 5px; font-size: 12px; color: var(--text-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .news-meta .source { color: var(--text-2); font-weight: 500; }
    .senti { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
    .senti.positive { color: var(--pos); background: color-mix(in srgb, var(--pos) 14%, transparent); }
    .senti.negative { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, transparent); }
    .senti.neutral  { color: var(--neu); background: color-mix(in srgb, var(--neu) 14%, transparent); }
    .signal { font-size: 11px; color: var(--text-3); }
    .day-sep { padding: 10px 16px 6px; font-size: 12px; font-weight: 700; color: var(--text-3); background: var(--hover); border-bottom: 1px solid var(--line); }
    .more { display: block; width: 100%; padding: 12px; color: var(--text-2); font-weight: 600; border-top: 1px solid var(--line); }
    .more:hover { color: var(--text-1); background: var(--hover); }
    .empty { padding: 40px 16px; text-align: center; color: var(--text-3); }

    /* ── 舆论温度计 ── */
    .meter { padding: 16px; margin-bottom: 16px; }
    .meter-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
    .meter-head b { font-size: 14px; }
    .meter-head span { font-size: 12px; color: var(--text-3); }
    .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--hover); gap: 2px; }
    .bar > i { display: block; height: 100%; }
    .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend b { color: var(--text-1); }
    .verdict { margin-top: 10px; font-size: 12.5px; color: var(--text-2); }

    /* 侧栏 */
    .mini-list { display: flex; flex-direction: column; gap: 10px; }
    .mini-item { display: flex; gap: 10px; font-size: 13px; line-height: 1.45; }
    .mini-item:hover .mini-title { color: var(--accent); }
    .mini-rank { width: 18px; flex-shrink: 0; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .mini-item:nth-child(1) .mini-rank { color: var(--accent); }
    .mini-item:nth-child(2) .mini-rank { color: color-mix(in srgb, var(--accent) 70%, var(--accent-2)); }
    .mini-item:nth-child(3) .mini-rank { color: var(--accent-2); }
    .mini-sub { font-size: 11.5px; color: var(--text-3); }
    .status-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); padding: 3px 0; gap: 8px; }
    .status-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-row .ok { color: var(--pos); } .status-row .bad { color: var(--neg); }
    .foot { font-size: 11.5px; color: var(--text-3); line-height: 1.6; }

    /* ── 响应式 ── */
    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .aside { position: static; }
    }
    @media (max-width: 760px) {
      .topbar-inner { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
      .logo small { display: none; }
      .tabs { order: 3; width: 100%; overflow-x: auto; }
      .tab { flex: 1; text-align: center; padding: 6px 8px; }
      .search { flex: 1 1 auto; }
      .search kbd { display: none; }
      .layout { padding: 16px 16px 50px; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -16px; margin-right: -16px; padding: 0 16px; }
      .chips::-webkit-scrollbar { display: none; }
      .hero h1 { font-size: 20px; }
      .reel-grid { grid-template-columns: repeat(2, 1fr); }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-sheet.kit-small { bottom: auto; }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }
    /* 列表页 */
    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-sheet.kit-small { height: auto; }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }
      .kit-big b { font-size: 24px; }
      .kit-lhead h2 { font-size: 19px; }
    }
    /* 封面没加载出来时的分类渐变底色（AI 紫 / 真人金 / 海外按标签轮换） */
    .ph-ai   { --ph: linear-gradient(140deg, color-mix(in srgb, var(--ai) 55%, var(--panel-solid)), color-mix(in srgb, var(--accent-2) 25%, var(--panel-solid))); }
    .ph-live { --ph: linear-gradient(140deg, color-mix(in srgb, var(--live) 50%, var(--panel-solid)), color-mix(in srgb, var(--accent) 25%, var(--panel-solid))); }
    .ph-0 { --ph: linear-gradient(150deg, color-mix(in srgb, var(--accent) 45%, var(--panel-solid)), var(--panel-solid)); }
    .ph-1 { --ph: linear-gradient(150deg, color-mix(in srgb, var(--accent-2) 45%, var(--panel-solid)), var(--panel-solid)); }
    .ph-2 { --ph: linear-gradient(150deg, color-mix(in srgb, var(--live) 40%, var(--panel-solid)), var(--panel-solid)); }
    .ph-3 { --ph: linear-gradient(150deg, color-mix(in srgb, var(--pos) 40%, var(--panel-solid)), var(--panel-solid)); }
    /* 可点开详情的元素 */
    .card[data-kit-item]:hover h4 { color: var(--accent); }
    .mini-item[data-kit-item] { border-radius: 6px; }
    .news-item[data-kit-item]:hover .news-title { color: var(--accent); }
    .more-link { display: block; padding: 12px; text-align: center; color: var(--text-2); font-weight: 600; border-top: 1px solid var(--line); }
    .more-link:hover { color: var(--text-1); background: var(--hover); }
    .section-title .kit-morelink { margin-left: auto; }
    .kit-big .muted { color: var(--text-3); font-size: 13px; }
    .kit-src { font-size: 11.5px; color: var(--text-3); margin-top: auto; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🎬</div>DramaPulse<small>短剧速递</small></div>
      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="picks">热门推荐</button>
        <button class="tab" data-tab="industry">行业新闻<span class="cnt" id="cnt-industry"></span></button>
        <button class="tab" data-tab="ai">AI 影响<span class="cnt" id="cnt-ai"></span></button>
      </nav>
      <div class="spacer"></div>
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--text-3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索剧名、新闻、来源" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <button class="icon-btn" id="theme" title="切换主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside class="aside" id="aside"></aside>
  </div>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.firstElementChild.classList.toggle('kit-small', !!d.small);       // 内容很少的提示：抽屉按内容高度
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    // 找不到这一条（已下榜 / 过期 / 链接是旧数据里的）：给个提示，而不是什么都不弹
    render(d || { small: true, title: '这条内容已不在当前数据里', sub: '数据每天自动更新，它可能已经下榜、过期或被合并到别的条目', thumbIcon: '🕓',
      body: KIT.p('可以回到首页看最新的内容，或用页面顶部的搜索找一找。'), acts: [{ text: '回到首页', href: '#', self: true, pri: true }] });
    return !!d;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('dp:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dp:' + k, JSON.stringify(v)); } catch {} },
};

const TOPICS = { all: '全部', policy: '政策监管', overseas: '出海', data: '数据报告', capital: '资本', platform: '平台', general: '其他' };
const SENTI = { positive: '正面', negative: '负面', neutral: '中性' };

const state = {
  tab: store.get('tab', 'picks'),
  kind: store.get('kind', 'all'),
  topic: 'all',
  senti: 'all',
  q: '',
};
let DATA = { industry: [], ai: [], overseas: [], status: [] };
let PICKS = { items: [] };

// ── 工具 ──
function ago(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  if (s < 86400 * 7) return Math.round(s / 86400) + ' 天前';
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function dayKey(iso) {
  const d = new Date(iso), now = new Date();
  const diff = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${'日一二三四五六'[d.getDay()]}`;
}
function fmtNum(n) {
  if (!n) return '';
  if (n >= 1e8) return (n / 1e8).toFixed(1) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1) + ' 万';
  return String(n);
}
function match(text) { return !state.q || text.toLowerCase().includes(state.q); }

// ── 条目 id ──
// 推荐：picks.json 里的下标（也认剧名）；海外：ReelShort 剧 id（24 位）；新闻：url 哈希
const hid = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
const reelId = r => (r.url || '').match(/-([0-9a-f]{24})-/)?.[1] || hid(r.url || r.title);
const newsId = n => n._id || (n._id = hid(n.url));
const findNews = id => DATA.industry.find(n => newsId(n) === id) || DATA.ai.find(n => newsId(n) === id);
const findPick = id => { const it = PICKS.items || []; return /^\d+$/.test(id) ? it[+id] : it.find(p => p.title === id); };
const findReel = id => (DATA.overseas || []).find(r => reelId(r) === id);
const phCls = (r, i) => 'ph-' + ((r.tags?.[0] || r.title || '').length + i) % 4;   // 海外封面占位色：按标签轮换
const HOME_N = 20;   // 新闻页签首页条数，其余进列表页

// ── 渲染：热门推荐 ──
function renderPicks() {
  const items = PICKS.items || [];
  const counts = { all: items.length, ai: items.filter(i => i.kind === 'ai').length, live: items.filter(i => i.kind === 'live').length };
  const list = items.filter(i => (state.kind === 'all' || i.kind === state.kind) &&
    match([i.title, i.form, i.platform, (i.genre || []).join(' '), i.synopsis].join(' ')));
  const reels = (DATA.overseas || []).filter(r => r.shelf === 'top' && match(r.title + ' ' + (r.tags || []).join(' ')));
  const fresh = (DATA.overseas || []).filter(r => r.shelf === 'new' && match(r.title + ' ' + (r.tags || []).join(' ')));

  return `
    <section class="hero">
      <h1>本周值得追的<em>热门短剧</em></h1>
      <p>国内榜单按周整理（AI 漫剧 / AI 仿真人 / 真人），海外热播每 3 小时自动同步 ReelShort。</p>
      <div class="meta-line">推荐更新于 ${esc(PICKS.updated_at || '—')} · ${esc(PICKS.period || '')}</div>
    </section>
    ${PICKS.summary ? `<div class="panel summary-box"><span>📊</span><div><b>本周风向：</b>${esc(PICKS.summary)}</div></div>` : ''}
    <div class="chips">
      ${[['all', '全部'], ['ai', 'AI 剧'], ['live', '真人剧']].map(([k, l]) =>
        `<button class="chip ${state.kind === k ? 'active' : ''}" data-kind="${k}">${k !== 'all' ? `<span class="dot" style="background:var(--${k})"></span>` : ''}${l}<span class="n">${counts[k]}</span></button>`).join('')}
    </div>
    ${list.length ? `<div class="grid">${list.map(pickCard).join('')}</div>` : '<div class="panel empty">没有匹配的剧</div>'}
    ${PICKS.notes ? `<p class="foot" style="margin-top:12px">※ ${esc(PICKS.notes)}</p>` : ''}

    <h2 class="section-title">🌏 海外热播 · ReelShort TOP<small>自动抓取 · 点开看简介</small></h2>
    ${reels.length ? `<div class="reel-grid">${reels.map((r, i) => reelCard(r, i + 1)).join('')}</div>` : '<div class="panel empty">暂无数据</div>'}
    ${fresh.length ? `<h2 class="section-title">🆕 ReelShort 新上线</h2><div class="reel-grid">${fresh.map(r => reelCard(r)).join('')}</div>` : ''}
  `;
}
function pickCard(i) {
  const id = PICKS.items.indexOf(i);
  const top = `<div class="card-top">
      <span class="badge ${i.kind}">${esc(i.form)}</span>
      <span class="badge plain">${esc(i.platform)}</span>
    </div>`;
  const rank = (i.rank_note || '').match(/#(\d+)/);
  // 封面加载失败时去掉横幅，标签回到正文顶部；加载中先显示分类渐变底色
  const head = i.cover ? `<div class="banner ph-${i.kind}">
      <img src="${esc(i.cover)}" alt="" loading="lazy" onerror="const c=this.closest('.card');c.classList.remove('has-cover');this.parentNode.replaceWith(c.querySelector('.banner .card-top'))">
      ${rank ? `<span class="banner-rank">#${rank[1]}</span>` : ''}
      ${top}
    </div>` : top;
  return `<article class="panel card${i.cover ? ' has-cover' : ''}" data-kit-item="pick/${id}">
    ${head}
    <h4>${esc(i.title)}</h4>
    <div><div class="rank-note">${esc(i.rank_note)}</div><div class="heat">${esc(i.heat)}</div></div>
    ${i.synopsis ? `<p>${esc(i.synopsis)}</p>` : ''}
    ${i.why_hot ? `<div class="why">${esc(i.why_hot)}</div>` : ''}
    <div class="tags">${(i.genre || []).map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>
    ${i.sources?.length ? `<div class="kit-src">来源：${i.sources.map(s => esc(s.name)).join(' · ')}</div>` : ''}
  </article>`;
}
function reelCard(r, rank) {
  const id = reelId(r), idx = DATA.overseas.indexOf(r);
  return `<a class="reel" href="#/item/reel/${id}" data-kit-item="reel/${id}">
    <div class="reel-cover ${phCls(r, idx)}">
      <img src="${esc(r.cover)}" alt="" loading="lazy" onerror="this.style.display='none'">
      ${rank ? `<span class="reel-rank">TOP ${rank}</span>` : ''}
      ${r.views ? `<span class="reel-views">▶ ${fmtNum(r.views)}</span>` : ''}
    </div>
    <h5>${esc(r.title)}</h5>
    <div class="tags">${r.episodes ? `<span class="tag">${r.episodes} 集</span>` : ''}${(r.tags || []).slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
  </a>`;
}

// ── 渲染：新闻列表（mode：industry / ai；limit：显示条数；more：底部链接 HTML）──
function newsList(items, mode, limit, more) {
  if (!items.length) return '<div class="panel empty">没有匹配的新闻</div>';
  let html = '', lastDay = '';
  items.slice(0, limit).forEach(n => {
    const day = dayKey(n.time), id = newsId(n);
    if (day !== lastDay) { html += `<div class="day-sep">${day}</div>`; lastDay = day; }
    const sentiCls = mode === 'ai' ? ` s-${n.sentiment}` : '';
    html += `<a class="news-item${sentiCls}" href="#/item/news/${id}" data-kit-item="news/${id}"><div class="news-body">
      <div class="news-title">${esc(n.title)}</div>
      <div class="news-meta">
        ${mode === 'ai' ? `<span class="senti ${n.sentiment}">${SENTI[n.sentiment]}</span>` : ''}
        ${mode === 'industry' && n.topic !== 'general' ? `<span class="badge plain">${TOPICS[n.topic]}</span>` : ''}
        ${mode === 'industry' && n.ai_related ? '<span class="badge ai">AI</span>' : ''}
        <span class="source">${esc(n.source)}</span>
        <span>${ago(n.time)}</span>
        ${n.lang === 'en' ? '<span class="badge plain">EN</span>' : ''}
        ${n.also?.length ? `<span>另有 ${n.also.length} 家报道</span>` : ''}
        ${mode === 'ai' && n.signals?.length ? `<span class="signal">#${n.signals.map(esc).join(' #')}</span>` : ''}
      </div>
    </div></a>`;
  });
  return `<div class="panel news">${html}${more || ''}</div>`;
}
const industryBase = () => DATA.industry.filter(n => match(n.title + ' ' + n.source));
const aiBase = () => DATA.ai.filter(n => match(n.title + ' ' + n.source));
const qs = (k, v) => v && v !== 'all' ? `?${k}=${encodeURIComponent(v)}` : '';

function renderIndustry() {
  const base = industryBase();
  const counts = { all: base.length };
  base.forEach(n => counts[n.topic] = (counts[n.topic] || 0) + 1);
  const list = base.filter(n => state.topic === 'all' || n.topic === state.topic);
  const more = list.length > HOME_N ? `<a class="more-link" href="#/list/industry${qs('topic', state.topic)}">查看全部 ${list.length} 条 →</a>` : '';
  return `
    <section class="hero">
      <h1>短剧<em>行业新闻</em></h1>
      <p>政策监管、平台动态、出海、数据报告和资本动向，聚合中外媒体，同一事件多家报道会合并。</p>
      <div class="meta-line">更新于 ${ago(DATA.updated_at)} · 保留近 45 天</div>
    </section>
    <div class="chips">
      ${Object.entries(TOPICS).filter(([k]) => k === 'all' || counts[k]).map(([k, l]) =>
        `<button class="chip ${state.topic === k ? 'active' : ''}" data-topic="${k}">${l}<span class="n">${counts[k] || 0}</span></button>`).join('')}
    </div>
    ${newsList(list, 'industry', HOME_N, more)}
  `;
}

function sentiStats(items) {
  const c = { positive: 0, negative: 0, neutral: 0 };
  items.forEach(n => c[n.sentiment]++);
  return c;
}
function meter(items, title, sub) {
  const c = sentiStats(items), total = items.length || 1;
  const pct = k => Math.round(c[k] / total * 100);
  let verdict;
  if (c.negative > c.positive * 1.3) verdict = '负面声音更多：岗位冲击、亏损和版权争议是主要话题。';
  else if (c.positive > c.negative * 1.3) verdict = '正面声音更多：降本提效和产能、出海机会是主要话题。';
  else verdict = '正负面声音大致持平，行业还在争论中。';
  return `<div class="panel meter">
    <div class="meter-head"><b>${title}</b><span>${sub}</span></div>
    <div class="bar">${['positive', 'neutral', 'negative'].map(k => c[k] ? `<i style="width:${c[k] / total * 100}%;background:var(--${k.slice(0, 3)})"></i>` : '').join('')}</div>
    <div class="legend">${['positive', 'negative', 'neutral'].map(k =>
      `<span><span class="dot" style="background:var(--${k.slice(0, 3)})"></span>${SENTI[k]} <b>${c[k]}</b> · ${pct(k)}%</span>`).join('')}</div>
    <div class="verdict">${items.length ? verdict : ''}</div>
  </div>`;
}

function renderAI() {
  const base = aiBase();
  const c = sentiStats(base);
  const list = base.filter(n => state.senti === 'all' || n.sentiment === state.senti);
  const week = base.filter(n => Date.now() - new Date(n.time) < 7 * 86400000);
  const more = list.length > HOME_N ? `<a class="more-link" href="#/list/ai${qs('senti', state.senti)}">查看全部 ${list.length} 条 →</a>` : '';
  return `
    <section class="hero">
      <h1>AI 对<em>短剧行业</em>的影响</h1>
      <p>只收录讨论 AI 如何改变这个行业的报道：降本提效、产能和出海机会，以及岗位冲击、版权侵权、同质化和亏损等问题，正面负面都收。</p>
      <div class="meta-line">更新于 ${ago(DATA.updated_at)} · 正负面由关键词自动判断，仅供参考</div>
    </section>
    ${meter(week, '近 7 天舆论温度', `${week.length} 篇报道`)}
    <div class="chips">
      <button class="chip ${state.senti === 'all' ? 'active' : ''}" data-senti="all">全部<span class="n">${base.length}</span></button>
      ${['positive', 'negative', 'neutral'].map(k =>
        `<button class="chip ${state.senti === k ? 'active' : ''}" data-senti="${k}"><span class="dot" style="background:var(--${k.slice(0, 3)})"></span>${SENTI[k]}<span class="n">${c[k]}</span></button>`).join('')}
    </div>
    ${newsList(list, 'ai', HOME_N, more)}
  `;
}

// ── 侧栏 ──
function renderAside() {
  const ai = DATA.ai, all = sentiStats(ai);
  const topAI = (PICKS.items || []).slice(0, 5);
  const latestAI = ai.slice(0, 5);
  const statusOk = DATA.status.filter(s => s.ok).length;
  return `
    <div class="panel widget">
      <h3>🔥 本周热榜</h3>
      <div class="mini-list">${topAI.map((p, i) => `<div class="mini-item" data-kit-item="pick/${i}"><span class="mini-rank">${i + 1}</span><div>
        <div class="mini-title">${esc(p.title)}</div><div class="mini-sub">${esc(p.form)} · ${esc(p.rank_note)}</div></div></div>`).join('')}</div>
    </div>
    <div class="panel widget">
      <h3>🤖 AI 影响 · 全部 ${ai.length} 篇<a class="kit-morelink" href="#/list/ai" style="margin-left:auto;font-size:12px">全部 →</a></h3>
      <div class="bar">${['positive', 'neutral', 'negative'].map(k => all[k] ? `<i style="width:${all[k] / (ai.length || 1) * 100}%;background:var(--${k.slice(0, 3)})"></i>` : '').join('')}</div>
      <div class="legend" style="gap:10px;font-size:12px">${['positive', 'negative', 'neutral'].map(k => `<span><span class="dot" style="background:var(--${k.slice(0, 3)})"></span>${SENTI[k]} ${all[k]}</span>`).join('')}</div>
      <div class="mini-list" style="margin-top:14px">${latestAI.map(n => `<a class="mini-item" href="#/item/news/${newsId(n)}" data-kit-item="news/${newsId(n)}">
        <span class="dot" style="background:var(--${n.sentiment.slice(0, 3)});margin-top:7px"></span>
        <div><div class="mini-title">${esc(n.title)}</div><div class="mini-sub">${esc(n.source)} · ${ago(n.time)}</div></div></a>`).join('')}</div>
    </div>
    <div class="panel widget">
      <h3>📡 数据来源 · ${statusOk}/${DATA.status.length} 正常</h3>
      ${DATA.status.filter(s => !s.ok).map(s => `<div class="status-row"><span>${esc(s.name)}</span><span class="bad">失败</span></div>`).join('')}
      <div class="foot">新闻：Google News 中英文 ${DATA.status.length - 1} 组关键词，每 3 小时抓取<br>海外热播：ReelShort 首页<br>国内推荐：每周人工 + AI 检索整理<br>最近抓取：${DATA.updated_at ? new Date(DATA.updated_at).toLocaleString('zh-CN', { hour12: false }) : '—'}</div>
    </div>
  `;
}

// ── 详情（右侧抽屉）与列表页 ──
const tg = t => t ? `<span>${esc(t)}</span>` : '';
const fmtTime = iso => new Date(iso).toLocaleString('zh-CN', { hour12: false }).slice(0, -3);
const newsRow = x => `<div class="kit-row" data-kit-go="news/${newsId(x)}"><span class="kit-rt">${esc(x.title)}</span><span class="kit-rm">${esc(x.source)} · ${ago(x.time)}</span></div>`;

KIT.item('pick', id => {
  const p = findPick(id); if (!p) return null;
  const others = PICKS.items.filter(o => o !== p && o.kind === p.kind).slice(0, 6);
  const hm = (p.heat || '').match(/[\d.]+\s*[万亿]?/);   // 热度里的数字做大字
  return { title: p.title, sub: `${esc(p.form)} · ${esc(p.platform)}`, cover: p.cover, coverTall: true,
    thumbIcon: p.kind === 'ai' ? '🤖' : '🎬', thumbBg: `color-mix(in srgb, var(--${p.kind}) 20%, transparent)`,
    tags: [tg(p.form), tg(p.platform), ...(p.genre || []).map(tg)],
    big: hm ? `<b>${esc(hm[0])}</b><span class="muted">${esc(p.heat.replace(hm[0], '').trim())}</span>` : '',
    body: KIT.sec('概况', KIT.kv([['形式', p.form], ['平台', p.platform], ['类型', (p.genre || []).join(' · ')], ['热度', p.heat], ['上榜', p.rank_note]]))
      + KIT.sec('剧情', KIT.p(p.synopsis))
      + KIT.sec('为什么火', KIT.p(p.why_hot))
      + KIT.sec('来源', p.sources?.length ? `<div class="kit-rows">${p.sources.map(s => `<a class="kit-row" href="${esc(s.url)}" target="_blank" rel="noopener"><span class="kit-rt">${esc(s.name)}</span><span class="kit-rm">↗</span></a>`).join('')}</div>` : '')
      + KIT.sec(`本周其它${p.kind === 'ai' ? ' AI 剧' : '真人剧'}`, others.length ? `<div class="kit-rows">${others.map(o => `<div class="kit-row" data-kit-go="pick/${PICKS.items.indexOf(o)}"><span class="kit-rt">${esc(o.title)}</span><span class="kit-rm">${esc(o.rank_note)}</span></div>`).join('')}</div>` : ''),
    acts: p.sources?.[0] ? [{ text: '查看榜单来源 ↗', href: p.sources[0].url }] : [] };
});
KIT.item('reel', id => {
  const r = findReel(id); if (!r) return null;
  const same = DATA.overseas.filter(o => o !== r && o.shelf === r.shelf).slice(0, 6);
  return { title: r.title, sub: `ReelShort · ${r.shelf === 'top' ? '热播榜' : '新上线'}`, cover: r.cover, coverTall: true,
    tags: (r.tags || []).map(tg), big: r.views ? `<b>${fmtNum(r.views)}</b><span class="muted">次播放</span>` : '',
    body: KIT.sec('数据', KIT.kv([['集数', r.episodes ? r.episodes + ' 集' : ''], ['播放量', fmtNum(r.views)], ['点赞', fmtNum(r.likes)], ['标签', (r.tags || []).join(' · ')]]))
      + KIT.sec('简介', KIT.p(r.synopsis ? r.synopsis + (r.synopsis.length >= 130 ? '…' : '') : ''), '英文原文')
      + KIT.sec(r.shelf === 'top' ? '同榜热播' : '同期新上线', `<div class="kit-rows">${same.map(o => `<div class="kit-row" data-kit-go="reel/${reelId(o)}"><img src="${esc(o.cover)}" alt="" loading="lazy"><span class="kit-rt">${esc(o.title)}</span><span class="kit-rm">${o.views ? '▶ ' + fmtNum(o.views) : ''}</span></div>`).join('')}</div>`),
    acts: [{ text: '去 ReelShort 看 ↗', href: r.url }] };
});
KIT.item('news', id => {
  const n = findNews(id); if (!n) return null;
  const isAI = n.section === 'ai';
  const pool = isAI ? DATA.ai : DATA.industry;
  const same = pool.filter(x => x !== n && (isAI ? x.sentiment === n.sentiment : x.topic === n.topic)).slice(0, 6);
  const sameName = isAI ? `同为${SENTI[n.sentiment]}的 AI 报道` : `同话题：${TOPICS[n.topic] || '其他'}`;
  const listHref = isAI ? `#/list/ai?senti=${n.sentiment}` : `#/list/industry?topic=${n.topic}`;
  return { title: n.title, sub: `${esc(n.source)} · ${fmtTime(n.time)}`,
    thumbIcon: isAI ? '🤖' : { policy: '⚖️', overseas: '🌏', data: '📊', capital: '💰', platform: '📱' }[n.topic] || '📰',
    thumbBg: `color-mix(in srgb, var(--${isAI ? n.sentiment.slice(0, 3) : 'accent'}) 18%, transparent)`,
    tags: [isAI ? tg(SENTI[n.sentiment]) : tg(TOPICS[n.topic]), n.ai_related ? tg('涉及 AI') : '', n.lang === 'en' ? tg('英文') : '', tg(ago(n.time))],
    body: KIT.sec('标签', KIT.kv([[isAI ? '情绪' : '话题', isAI ? SENTI[n.sentiment] + '（关键词自动判断）' : TOPICS[n.topic]], ['信号', (n.signals || []).join(' · ')],
        ['来源', n.source], ['语言', n.lang === 'en' ? '英文' : '中文']]))
      + KIT.sec('说明', KIT.p('这条是从 Google 新闻按关键词聚合来的标题，正文在原网站。'))
      + KIT.sec('同时报道的媒体', n.also?.length ? `<div class="kit-tags">${n.also.map(tg).join('')}</div>` : '', `${n.also?.length || 0} 家`)
      + KIT.sec(sameName, same.length ? `<div class="kit-rows">${same.map(newsRow).join('')}</div>` : '', `<a class="kit-morelink" href="${listHref}">全部 →</a>`),
    acts: [{ text: '阅读原文 ↗', href: n.url }] };
});

// 列表页
const LPAGE = 30;
let listN = LPAGE;
const SORTS = [['new', '最新'], ['hot', '多家报道优先']];
const sortNews = (list, s) => s === 'hot' ? [...list].sort((a, b) => (b.also?.length || 0) - (a.also?.length || 0) || new Date(b.time) - new Date(a.time)) : list;
KIT.list('industry', (_, q, box) => {
  const topic = q.get('topic') || 'all', sort = q.get('sort') || 'new', base = industryBase();
  const all = sortNews(base.filter(n => topic === 'all' || n.topic === topic), sort);
  box.innerHTML = KIT.shell({ title: '短剧行业新闻', note: `${all.length} 条${state.q ? ` · 搜索「${esc(state.q)}」` : ''}`,
    chips: Object.entries(TOPICS).map(([k, n]) => ({ text: n, href: '#/list/industry' + qs('topic', k), on: k === topic, count: base.filter(x => k === 'all' || x.topic === k).length })).filter(c => c.count || c.on),
    sort: SORTS, sortVal: sort,
    body: newsList(all, 'industry', listN), more: all.length > listN ? `加载更多（${listN} / ${all.length}）` : '' });
});
KIT.list('ai', (_, q, box) => {
  const senti = q.get('senti') || 'all', sort = q.get('sort') || 'new', base = aiBase();
  const all = sortNews(base.filter(n => senti === 'all' || n.sentiment === senti), sort);
  box.innerHTML = KIT.shell({ title: 'AI 对短剧行业的影响', note: `${all.length} 篇${state.q ? ` · 搜索「${esc(state.q)}」` : ''}`,
    chips: [['all', '全部'], ...Object.entries(SENTI)].map(([k, n]) => ({ text: n, href: '#/list/ai' + qs('senti', k), on: k === senti, count: base.filter(x => k === 'all' || x.sentiment === k).length })),
    sort: SORTS, sortVal: sort,
    body: newsList(all, 'ai', listN), more: all.length > listN ? `加载更多（${listN} / ${all.length}）` : '' });
});
document.addEventListener('click', e => { if (e.target.closest('[data-kit-more]')) { listN += LPAGE; render(); } });
document.addEventListener('change', e => {
  if (!e.target.matches('[data-kit-sort]')) return;
  const r = KIT.parse(); if (!r) return;
  r.q.set('sort', e.target.value);
  if (e.target.value === 'new') r.q.delete('sort');
  location.hash = `#/list/${r.type}${r.q.toString() ? '?' + r.q : ''}`;
});
window.addEventListener('hashchange', () => { if (KIT.parse()?.kind !== 'item') listN = LPAGE; }, true);

// ── 主渲染 ──
function render() {
  const r = KIT.parse(), cur = r?.kind === 'list' ? r.type : state.tab;   // 列表页时高亮对应页签
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === cur));
  $('#cnt-industry').textContent = DATA.industry.length || '';
  $('#cnt-ai').textContent = DATA.ai.length || '';
  $('#aside').innerHTML = renderAside();
  if (KIT.route($('#main'))) return;                     // #/list/… 列表页
  $('#main').innerHTML = { picks: renderPicks, industry: renderIndustry, ai: renderAI }[state.tab]();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-kind],[data-topic],[data-senti]');
  if (!t) return;
  if (t.dataset.tab) {
    state.tab = t.dataset.tab; store.set('tab', state.tab); window.scrollTo({ top: 0 });
    if (KIT.parse()?.kind === 'list') { location.hash = ''; return; }   // 在列表页点页签：回到对应页签首页
  }
  if (t.dataset.kind) { state.kind = t.dataset.kind; store.set('kind', state.kind); }
  if (t.dataset.topic) state.topic = t.dataset.topic;
  if (t.dataset.senti) state.senti = t.dataset.senti;
  render();
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); listN = LPAGE; render(); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; render(); $('#q').blur(); }
});

// 主题
function applyTheme(t) { document.documentElement.dataset.theme = t; }
applyTheme(store.get('theme', 'dark'));
$('#theme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
});

async function load() {
  // no-cache：每次都向服务器校验（未变化时返回 304），避免更新后仍读到旧数据
  const [d, p] = await Promise.all([
    fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('picks.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
  ]);
  if (d) DATA = d;
  if (p) PICKS = p;
  if (!['picks', 'industry', 'ai'].includes(state.tab)) state.tab = 'picks';
  render();
  if (!booted) { booted = true; KIT.boot(); }   // 直接打开 #/item/ 链接（大屏跳转）
}
let booted = false;
KIT.init(render);
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
